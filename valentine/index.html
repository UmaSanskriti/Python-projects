<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HEART.OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Scanline overlay -->
  <div id="scanlines"></div>

  <!-- Boot Screen -->
  <div id="boot-screen">
    <div id="boot-text"></div>
  </div>

  <!-- Terminal Screen -->
  <div id="terminal-screen" class="hidden">
    <div id="fragment-counter">
      <span class="frag" id="frag-1">_</span>
      <span class="frag" id="frag-2">_</span>
      <span class="frag" id="frag-3">_</span>
    </div>
    <div id="terminal">
      <div id="output"></div>
      <div id="input-line">
        <span id="prompt">manas@heart:~$&nbsp;</span>
        <input type="text" id="cmd" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>
    </div>
  </div>

  <!-- Photo Montage — terminal-framed rapid flash -->
  <div id="montage-screen" class="hidden">
    <div id="montage-flash"></div>
  </div>

  <!-- Reveal Screen -->
  <div id="reveal-screen" class="hidden">
    <div id="reveal-photos"></div>
    <canvas id="hearts-canvas"></canvas>
    <div id="reveal-content">
      <p id="reveal-message"></p>
      <div id="reveal-buttons" class="hidden">
        <button id="btn-yes">Yes!</button>
        <button id="btn-no">nah</button>
      </div>
    </div>
    <div id="celebration" class="hidden">
      <canvas id="confetti-canvas"></canvas>
      <div id="celeb-text"></div>
    </div>
  </div>

  <!-- YouTube player (off-screen, needs real size for browsers to allow audio) -->
  <div id="yt-player-wrap" style="position:fixed;left:-300px;top:-300px;width:256px;height:144px;pointer-events:none;">
    <div id="yt-player"></div>
  </div>

  <script src="js/terminal.js"></script>
</body>
</html>
